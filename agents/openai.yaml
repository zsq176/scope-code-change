interface:
  display_name: "Code Change Scope"
  short_description: "Proportionate, evidence-based rigor for code changes"
  default_prompt: "Use $scope-code-change before implementing this code change. Gauge the blast radius first, then apply the matching level of rigor: know what else the change touches, plan atomic goals with exact code targets, verify with real evidence rather than argument, and report honestly — cleaning up everything provisional afterwards."
